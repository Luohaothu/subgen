[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "subgen"
dynamic = ["version"]
description = "Resumable Japanese-to-Chinese subtitle pipeline for a local video corpus"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Luohao Wang", email = "luohaothu@live.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["subtitles", "asr", "forced-alignment", "translation", "stash"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "av>=15",
  "opencc-python-reimplemented",
  "soundfile>=0.14",
]

[project.optional-dependencies]
models = [
  "funasr>=1.3.14",
  "nagisa",
  "torch>=2.11",
  "transformers>=5.13",
]
mlx = ["mlx-lm>=0.28"]

[dependency-groups]
dev = ["pre-commit>=3.7", "pytest>=8.0", "ruff>=0.15"]

[project.scripts]
subgen = "subtitle_pipeline.cli:main"

[tool.hatch.version]
path = "src/subtitle_pipeline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_pipeline"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["subtitle_pipeline"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
